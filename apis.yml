name: Congress.gov API
description: >
  The official REST API for the United States Congress, provided by the Library
  of Congress. It offers public access to machine-readable legislative data
  including bills, amendments, laws, committee reports, the Congressional
  Record, nominations, treaties, CRS reports, house votes, hearings, and
  member information. The API is free to use and requires a key obtained via
  the Data.gov signup page. Responses are available in JSON or XML format, with
  version 3 (v3) as the current release.
